# generated by aruco_perception.sim_markers from markers.yml; do not hand-edit
marker_dict: DICT_4X4_50
sensors:
  robot_table_camera:
    image_topic: /perception/color
    camera_info_topic: /perception/camera_info
    camera_link_frame: perception
    anchor_frame: marker_anchor
  rk_table_camera:
    image_topic: /rk/color
    camera_info_topic: /rk/camera_info
    camera_link_frame: rk
    anchor_frame: rk_anchor
model:
  path_type: ros
  package: bdd_collab_bhv_cpp
  path: models/collab/collab.scenex
frames:
- frame: marker_anchor
  iri: collab-scn:collab-kgraph/marker0-body/marker0_origin
  marker:
    marker_size: 0.1
    marker_id: 0
- frame: rk_anchor
  iri: collab-scn:collab-kgraph/marker10-body/marker10_origin
  marker:
    marker_size: 0.1
    marker_id: 10
- frame: marker_handle
  marker:
    marker_size: 0.05
    marker_id: 1
- frame: marker_back
  marker:
    marker_size: 0.05
    marker_id: 2
- frame: base_link
  iri: collab-scn:collab-kgraph/robot-table-body/arm-mount
- frame: robot_table_top
  iri: collab-scn:collab-kgraph/robot-table-body/table_top
- frame: rk_table_top
  iri: collab-scn:collab-kgraph/rk-table-body/work_surface
- frame: drawer_handle
  iri: collab-scn:collab-kgraph/drawer-body/drawer-handle
  fixed:
  - wrt: marker_handle
    x: -0.065
    y: 0.0
    z: 0.02
    roll: -1.5708
    pitch: 0.0
    yaw: 0.0
  - wrt: marker_back
    x: 0.0
    y: 0.0
    z: -0.22
    roll: 1.5708
    pitch: 0.0
    yaw: -3.14159
ref_frame: base_link
objects:
- name: robot_table_obj
  frame: robot_table_top
  iri: collab-scn:robot-ws
- name: drawer_handle_obj
  frame: drawer_handle
  iri: collab-scn:collab-kgraph/drawer-body/drawer-handle
- name: drawer_obj
  frame: drawer_handle
  iri: collab-scn:drawer
- name: rk_table_obj
  frame: rk_table_top
  iri: collab-scn:wall-ws
