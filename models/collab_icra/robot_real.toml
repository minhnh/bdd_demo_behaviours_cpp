# Where each device is reached. Keyed by the name the execution context binds.

[collab-agents.kinova]
ip                    = "192.168.1.10"
user                  = "admin"
password              = "admin"
port                  = 10000
port_real_time        = 10001
session_timeout_ms    = 60000
connection_timeout_ms = 2000

[collab-agents.gripper]
port              = "/dev/ttyUSB1"
baudrate          = 115200
slave_address     = 0x09
gripper_force_pct = 100
gripper_speed_pct = 50

[kinova.wrist_ft]
port             = "/dev/ttyUSB0"
baudrate         = 19200
timeout_ms       = 50.0
invalid_after_ms = 1000.0
slave_address    = 0x09
bias_samples     = 100

[ros.joint_states]
topic = "/joint_states"
rate  = 100.0

[rosbag]
topics = [
    "/bdd/status",
    "/bdd/events",
    "/obs_policy/container_not_dropped",
    "/ee_wrench",
    "/ee_wrench_est",
    "/ee_pose",
    "/recognized_objects",
    "/tf",
    "/tf_static",
    "/joint_states",
]
