# Source of truth for the simulated markers; PNGs, marker MJCF and the perception YAML are generated:
#   ros2 run aruco_perception gen_sim_markers --markers <this file> \
#     --asset-dir src/bdd_collab_bhv_cpp/assets/markers \
#     --setup-out src/bdd_collab_bhv_cpp/config/collab_sim_perception.yml
dictionary: DICT_4X4_50
module_px: 100
quiet_modules: 1

sensors:
  robot_table_camera:
    image_topic: /perception/color
    camera_info_topic: /perception/camera_info
    camera_link_frame: perception
    anchor_frame: marker_anchor
  rk_table_camera:
    image_topic: /rk/color
    camera_info_topic: /rk/camera_info
    camera_link_frame: rk
    anchor_frame: rk_anchor

model:
  path_type: ros
  package: bdd_collab_bhv_cpp
  path: models/collab/collab.scenex

# The frame the controller states its handle pose against; a subscription writes the reading in as is.
ref_frame: base_link

markers:
  - frame: marker_anchor
    iri: collab-scn:collab-kgraph/marker0-body/marker0_origin
    id: 0
    size: 0.1

  - frame: rk_anchor
    iri: collab-scn:collab-kgraph/marker10-body/marker10_origin
    id: 10
    size: 0.1

  # Printed onto a copy of the tray asset: a weld onto an object frame loses its offset.
  - frame: marker_handle
    id: 1
    size: 0.05
    mount:
      asset: ../tray/tray.xml
      out: ../tray/tray_markers.xml
      body: root
      pos: [0.065, -0.100, 0.040]
      euler: [0.0, 0.0, 90.0]
  - frame: marker_back
    id: 2
    size: 0.05
    mount:
      asset: ../tray/tray.xml
      out: ../tray/tray_markers.xml
      body: root
      pos: [0.0, 0.100, 0.040]
      euler: [180.0, 0.0, 90.0]

frames:
  - frame: base_link
    iri: collab-scn:collab-kgraph/robot-table-body/arm-mount
  - frame: robot_table_top
    iri: collab-scn:collab-kgraph/robot-table-body/table_top
  - frame: rk_table_top
    iri: collab-scn:collab-kgraph/rk-table-body/work_surface
  - frame: drawer_handle
    iri: collab-scn:collab-kgraph/drawer-body/drawer-handle
    # The markers sit on vertical walls: each offset turns the sheet's normal back onto the tray's axes.
    fixed:
      - wrt: marker_handle
        x: -0.065
        y: 0.0
        z: 0.02
        roll: -1.5708
        pitch: 0.0
        yaw: 0.0
      - wrt: marker_back
        x: 0.0
        y: 0.0
        z: -0.22
        roll: 1.5708
        pitch: 0.0
        yaw: -3.14159

objects:
  - name: robot_table_obj
    frame: robot_table_top
    iri: collab-scn:robot-ws
  # The handle frame's IRI, which is what a subscribed controller matches detections by.
  - name: drawer_handle_obj
    frame: drawer_handle
    iri: collab-scn:collab-kgraph/drawer-body/drawer-handle
  # The same reading under the object's own IRI: `of:` takes a frame, the scenario takes an
  # object, and the two match detections by different URIs.
  - name: drawer_obj
    frame: drawer_handle
    iri: collab-scn:drawer
  - name: rk_table_obj
    frame: rk_table_top
    iri: collab-scn:wall-ws
