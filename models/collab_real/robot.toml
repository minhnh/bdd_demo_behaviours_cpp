# Where each device is reached. Keyed by the name the execution context binds.
#
# Three devices bound separately, so each opens its own connection: the arm over the network,
# the gripper and the force-torque sensor over serial.

[collab-agents.kinova]
ip                    = "192.168.1.10"
user                  = "admin"
password              = "admin"
port                  = 10000
port_real_time        = 10001
session_timeout_ms    = 60000
connection_timeout_ms = 2000

# A full path, unlike the FT sensor below: this driver opens the port it is given, where the
# sensor's resolves the name under /dev/ itself.
[collab-agents.gripper]
port          = "/dev/ttyUSB1"
baudrate      = 115200
slave_address = 0x09
gripper_force_pct = 100
gripper_speed_pct = 50

[kinova.wrist_ft]
port          = "ttyUSB0"
baudrate      = 19200
timeout_ms    = 1.0
slave_address = 0x09
bias_samples  = 100

# Publishing the driven joints is the deployment's call, not the model's: the section's presence
# turns it on, and retuning the topic or the rate needs no regeneration.
[ros.joint_states]
topic = "/joint_states"
rate  = 100.0

#[poses.home]
#position = [0.55, 0.0, 0.35]
#orientation = [1.57, 0.00000, 1.57]

[poses.look-table]
position = [-0.34, -0.7, 0.35]
orientation = [2.0, 0.0, 0]

[poses.touch-align]
position = [-0.34, -0.7, 0.35]
orientation = [1.57, 0.0, 0]

[poses.pre-placement-pose]
position = [0.8, 0.0, 0.20]
orientation = [1.57, 0.0, 1.57]