%YAML 1.2
---
launch:
  - arg:
      name: "ns"
      default: "bdd"
  - arg:
      name: "bhv_server_name"
      default: "/bhv_server"
  - node:
      pkg: "bdd_demo_behaviours_cpp"
      exec: "human_pickplace_mockup_node"
      namespace: "$(var ns)"
      name: "human_pickplace_mockup_node"
      param:
        - name: "bhv_server_name"
          value: "$(var bhv_server_name)"
