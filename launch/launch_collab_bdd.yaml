%YAML 1.2
---
launch:
  - arg:
      name: "ns"
      default: "bdd"
  - arg:
      name: "use_sim_time"
      default: "False"
  - arg:
      name: "config"
      default: "$(find-pkg-share bdd_collab_bhv_cpp)/config/bdd_coordination.yaml"
  - arg:
      name: "graph_models"
      default: "$(find-pkg-share bdd_collab_bhv_cpp)/models/collab/collab_models.yaml"
  - arg:
      name: "bhv_server_name"
      default: "/bdd/collab_bhv_server"
  - arg:
      name: "event_topic"
      default: "/bdd/events"
  - node:
      pkg: "bdd_exec_ros2"
      exec: "bdd_coordination_node"
      namespace: "$(var ns)"
      name: "collab_coordinator"
      param:
        - from: "$(var config)"
        - name: "graph_models"
          value: "$(var graph_models)"
        - name: "bhv_server_name"
          value: "$(var bhv_server_name)"
        - name: "event_topic"
          value: "$(var event_topic)"
        - name: "use_sim_time"
          value: "$(var use_sim_time)"
